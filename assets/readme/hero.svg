<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="auto" role="img" aria-label="Codex Cockpit Header Banner">
  <title>Codex Cockpit Hero</title>
  <style><![CDATA[
    .bg { fill: #0b0f19; }
    .grid { stroke: #1e293b; stroke-width: 1; stroke-dasharray: 4,4; }
    .panel { fill: #111827; stroke: #1e293b; stroke-width: 1.5; }
    .badge { fill: #1e293b; stroke: #334155; stroke-width: 1; }
    .txt-tag { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 12px; font-weight: 600; fill: #38bdf8; letter-spacing: 0.12em; text-transform: uppercase; }
    .txt-title { font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 38px; font-weight: 800; fill: #f8fafc; letter-spacing: -0.02em; }
    .txt-desc { font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 16px; line-height: 1.6; fill: #94a3b8; }
    .txt-sub { font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; fill: #cbd5e1; }
    .telemetry-txt { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 11px; fill: #64748b; }
    .telemetry-val { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 11px; font-weight: 600; fill: #34d399; }
    .code-txt { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 11px; fill: #cbd5e1; }

    /* UI Capsule & Progress */
    .pill-frame { fill: #1e293b; stroke: #38bdf8; stroke-width: 1.5; }
    .bar-bg { fill: #1e293b; rx: 4; }
    .bar-fill { fill: #38bdf8; rx: 4; }

    @media (prefers-color-scheme: light) {
      .bg { fill: #f8fafc; }
      .grid { stroke: #e2e8f0; }
      .panel { fill: #ffffff; stroke: #e2e8f0; }
      .badge { fill: #f1f5f9; stroke: #cbd5e1; }
      .txt-tag { fill: #0284c7; }
      .txt-title { fill: #0f172a; }
      .txt-desc { fill: #475569; }
      .txt-sub { fill: #334155; }
      .telemetry-txt { fill: #64748b; }
      .telemetry-val { fill: #059669; }
      .code-txt { fill: #334155; }
      .pill-frame { fill: #f1f5f9; stroke: #0284c7; }
      .bar-bg { fill: #e2e8f0; }
      .bar-fill { fill: #0284c7; }
    }
  ]]></style>

  <!-- Background -->
  <rect width="1200" height="360" rx="16" class="bg" />

  <!-- Grid -->
  <g class="grid">
    <line x1="60" y1="0" x2="60" y2="360" />
    <line x1="320" y1="0" x2="320" y2="360" />
    <line x1="600" y1="0" x2="600" y2="360" />
    <line x1="880" y1="0" x2="880" y2="360" />
    <line x1="0" y1="70" x2="1200" y2="70" />
    <line x1="0" y1="180" x2="1200" y2="180" />
    <line x1="0" y1="290" x2="1200" y2="290" />
  </g>

  <!-- Left: Content -->
  <g transform="translate(60, 42)">
    <rect x="0" y="0" width="260" height="26" rx="13" class="badge" />
    <circle cx="12" cy="13" r="4" fill="#38bdf8" />
    <text x="24" y="17" class="txt-tag">DESKTOP UTILITY // TAURI + RUST</text>

    <text x="0" y="70" class="txt-title">🛸 Codex 驾驶舱</text>
    <text x="0" y="106" class="txt-desc">挂在屏幕边缘的轻量 Token 用量与额度悬浮窗。</text>
    <text x="0" y="132" class="txt-desc">实时掌握剩余额度、单任务消耗与热力日历，支持一键导出小票报表。</text>

    <!-- Badges Grid -->
    <g transform="translate(0, 168)">
      <g transform="translate(0, 0)">
        <rect width="235" height="40" rx="8" class="panel" />
        <circle cx="18" cy="20" r="4" fill="#38bdf8" />
        <text x="32" y="25" class="txt-sub">悬浮小窗 · 随时展开/贴边收起</text>
      </g>
      <g transform="translate(247, 0)">
        <rect width="235" height="40" rx="8" class="panel" />
        <circle cx="18" cy="20" r="4" fill="#34d399" />
        <text x="32" y="25" class="txt-sub">任务用量追踪与小票图生成</text>
      </g>
      <g transform="translate(0, 48)">
        <rect width="235" height="40" rx="8" class="panel" />
        <circle cx="18" cy="20" r="4" fill="#fb7185" />
        <text x="32" y="25" class="txt-sub">本地优先 · 无需注册托管账号</text>
      </g>
      <g transform="translate(247, 48)">
        <rect width="235" height="40" rx="8" class="panel" />
        <circle cx="18" cy="20" r="4" fill="#a78bfa" />
        <text x="32" y="25" class="txt-sub">跨平台适配 · macOS / Windows / Linux</text>
      </g>
    </g>

    <g transform="translate(0, 286)">
      <text x="0" y="0" class="telemetry-txt">COMMUNITY INDEPENDENT PROJECT · NOT AN OFFICIAL OPENAI PRODUCT</text>
    </g>
  </g>

  <!-- Right: Cockpit Floating HUD Wireframe -->
  <g transform="translate(680, 40)">
    <rect width="460" height="280" rx="14" class="panel" />

    <!-- Window Header -->
    <line x1="0" y1="36" x2="460" y2="36" stroke="#1e293b" class="grid" />
    <circle cx="20" cy="18" r="4" fill="#38bdf8" />
    <text x="32" y="22" class="telemetry-txt">CODEX_COCKPIT // FLOATING_PILL_UI</text>
    <rect x="375" y="10" width="65" height="18" rx="4" class="badge" />
    <text x="388" y="22" class="telemetry-val">ONLINE</text>

    <!-- Floating Pill Replica -->
    <g transform="translate(30, 56)">
      <rect width="400" height="42" rx="21" class="pill-frame" />
      <circle cx="22" cy="21" r="6" fill="#34d399" />
      <text x="38" y="26" class="code-txt" font-weight="700">Codex Plan</text>
      <text x="130" y="26" class="code-txt">Remaining: 74%</text>
      <rect x="240" y="17" width="100" height="8" rx="4" class="bar-bg" />
      <rect x="240" y="17" width="74" height="8" rx="4" class="bar-fill" />
      <text x="355" y="26" class="telemetry-val">3.2k/h</text>
    </g>

    <!-- Detail Dashboard Content Preview -->
    <g transform="translate(30, 116)">
      <rect width="400" height="136" rx="8" class="badge" />

      <text x="16" y="24" class="telemetry-txt">DAILY TOKEN BREAKDOWN</text>
      <text x="280" y="24" class="telemetry-txt">RESET IN 14h</text>

      <!-- Task items -->
      <g transform="translate(16, 38)">
        <text x="0" y="14" class="code-txt">▪ Backend Refactor (gpt-5-codex)</text>
        <text x="290" y="14" class="telemetry-val">42.1k Tok</text>

        <text x="0" y="36" class="code-txt">▪ Unit Tests Generation</text>
        <text x="290" y="36" class="telemetry-val">18.4k Tok</text>

        <text x="0" y="58" class="code-txt">▪ Architecture Review</text>
        <text x="290" y="58" class="telemetry-val">6.2k Tok</text>
      </g>

      <!-- Receipt Button simulation -->
      <g transform="translate(16, 104)">
        <rect width="120" height="22" rx="4" class="panel" />
        <text x="12" y="15" class="telemetry-txt" font-size="10">🧾 生成用量小票</text>
      </g>
    </g>
  </g>
</svg>
